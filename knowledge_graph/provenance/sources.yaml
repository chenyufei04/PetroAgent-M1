    notes_zh: 支持阻力系数、机械降解、岩心注入能力和径向流条件的评价。
  - source_id: opm_flow_2023_polymer
    source_type: software_reference_manual
    name_zh: OPM Flow 2023.04 聚合物模型参考手册
    name_en: OPM Flow Reference Manual 2023.04 — Polymer Model
