    year: 2023
    publisher: Open Porous Media Initiative
    url: https://opm-project.org/wp-content/uploads/2023/06/OPM_Flow_Reference_Manual_2023-04_Rev-0_Reduced.pdf
    notes_zh: 支持聚合物黏度、吸附、不可进入孔隙体积、渗透率降低、混合和剪切模型的数模完整性规则。
