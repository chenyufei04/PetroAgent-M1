provider: ollama
runtime: ollama
model: qwen3:8b
base_url: http://127.0.0.1:11434
generation:
  temperature: 0.4
  max_tokens: 1200
  think: false
  format: json
agent:
  mode: read_only
  allowed_tools:
    - scenario_context
    - scenario_rankings
    - scenario_explanation
  require_user_approval_for_writes: true
retrieval:
  strategy: graph_file_hybrid
  graph_source: neo4j
  fallback_source: experiment_artifacts
  include_rule_evidence: true
