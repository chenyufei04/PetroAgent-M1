[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petro-agent-m1"
version = "0.6.0"
description = "Traceable petroleum-engineering analysis core with a Neo4j-backed knowledge graph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "openpyxl>=3.1,<4",
  "PyYAML>=6.0,<7",
  "neo4j>=5.20,<7",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
petro-agent = "petro_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
