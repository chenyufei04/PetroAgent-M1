    source_type: peer_reviewed_article
    name_zh: 聚合物驱数据分析与更新筛选准则
    name_en: Data Analysis and Updated Screening Criteria for Polymer Flooding
    authority_level: peer_reviewed
    year: 2014
    publisher: Society of Petroleum Engineers
    doi: 10.2118/162170-PA
    url: https://onepetro.org/REE/article/17/01/15/205378/
    notes_zh: 用于候选油藏初筛；阈值是经验筛选边界，不是普适物理定律。
  - source_id: taber_1997_screening
    source_type: peer_reviewed_article
    name_zh: 提高采收率筛选准则再研究（第二部分）
    name_en: EOR Screening Criteria Revisited—Part 2
    authority_level: peer_reviewed
    year: 1997
    publisher: Society of Petroleum Engineers
    doi: 10.2118/39234-PA
    url: https://onepetro.org/RE/article/12/03/199/108113/
