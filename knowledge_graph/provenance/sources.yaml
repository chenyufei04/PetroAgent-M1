    publisher: Society of Petroleum Engineers
    doi: 10.2118/179543-PA
    url: https://onepetro.org/SJ/article/22/01/1/206080/
    notes_zh: 用于聚合物浓度、黏度和段塞尺寸的方案设计知识，不提供单一通用最优值。
  - source_id: seright_2009_injectivity
    source_type: peer_reviewed_article
    name_zh: 提高采收率聚合物的注入能力特征
    name_en: Injectivity Characteristics of EOR Polymers
